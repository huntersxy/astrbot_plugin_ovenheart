[project]
name = "astrbot-plugin-ovenheart"
version = "0.51.2"
description = "Evidence-based personality, language and behavior learning for AstrBot"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.15", "fastapi>=0.124", "httpx>=0.28"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.format]
# Preserve verbatim provider responses, including fenced Python examples.
exclude = ["docs/evaluation/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
