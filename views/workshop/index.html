<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>烤箱之心人格工坊</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./memory.js" defer></script>
    <script src="./emojis.js" defer></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main id="workshop">
      <header class="page-head">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"
            ><svg viewBox="0 0 24 24">
              <path
                d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
              />
              <path
                d="M12 6.5c.4 1.3 1.2 2.1 2.5 2.5-1.3.4-2.1 1.2-2.5 2.5-.4-1.3-1.2-2.1-2.5-2.5 1.3-.4 2.1-1.2 2.5-2.5Z"
                fill="#fff"
                stroke="none"
              /></svg
          ></span>
          <div>
            <h1>烤箱之心</h1>
            <p>把相处中的习惯，慢慢变成自己的表达。</p>
          </div>
        </div>
        <div class="head-actions">
          <button id="refresh" type="button">刷新</button>
        </div>
      </header>
      <div class="workshop-layout">
        <aside class="workshop-sidebar" aria-label="工坊导航">
          <div class="sidebar-content">
            <nav class="tabs" aria-label="工坊页面">
              <p class="nav-label">人格</p>
              <button type="button" data-tab="profile" aria-current="page">
                人格底稿
              </button>
              <button type="button" data-tab="portrait">自画像</button>
              <p class="nav-label">学习</p>
              <button type="button" data-tab="library">
                学习库 <span id="review-count"></span>
              </button>
              <button type="button" data-tab="history">学习与参与</button>
              <p class="nav-label">记忆</p>
              <button type="button" data-tab="memory">记忆</button>
              <button type="button" data-tab="emojis">表情</button>
              <p class="nav-label">进阶</p>
              <button type="button" data-tab="settings">设置</button>
              <button type="button" data-tab="prompts">提示词</button>
            </nav>
            <p class="sidebar-note">学习补习惯，底稿定身份。</p>
          </div>
        </aside>
        <div class="workshop-main">
          <div id="notice" role="status" aria-live="polite" hidden></div>
          <section id="content" aria-label="工坊内容" aria-live="polite">
            <div class="empty">
              <h2>正在打开人格工坊</h2>
              <p>读取人格、学习与记忆内容。</p>
            </div>
          </section>
        </div>
      </div>
      <footer>OvenHeart <span>人格工坊</span></footer>
    </main>
    <dialog
      id="confirmation"
      aria-labelledby="confirmation-title"
      aria-describedby="confirmation-message"
    >
      <form method="dialog">
        <h2 id="confirmation-title">确认操作</h2>
        <p id="confirmation-message"></p>
        <div class="actions">
          <button value="cancel" class="text" autofocus>取消</button
          ><button value="continue" class="tonal">继续</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
