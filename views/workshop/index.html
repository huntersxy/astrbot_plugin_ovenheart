<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Persona 人格工坊</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main id="workshop">
    <header class="page-head">
      <div><h1>人格工坊</h1><p>把相处中的习惯，慢慢变成自己的表达。</p></div>
      <div class="head-actions"><button id="refresh" type="button">刷新</button><button id="learn" class="primary" type="button" disabled>开始学习</button></div>
    </header>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <section class="session-bar" aria-label="当前会话">
      <div class="scope-field"><label for="scope">会话与人格</label><select id="scope" disabled><option value="">正在连接 AstrBot…</option></select></div>
      <p id="session-status">等待加载</p>
      <p id="memory-status">正在检查记忆联动</p>
    </section>
    <nav class="tabs" aria-label="工坊页面">
      <button type="button" data-tab="profile" aria-current="page">人格底稿</button>
      <button type="button" data-tab="library">学习库 <span id="review-count"></span></button>
      <button type="button" data-tab="history">学习记录</button>
      <button type="button" data-tab="settings">学习设置</button>
    </nav>
    <section id="content" aria-live="polite"><div class="empty"><h2>正在打开人格工坊</h2><p>连接当前 AstrBot 会话与学习记录。</p></div></section>
    <footer>Persona <span>学习补充习惯，底稿决定自己是谁。</span></footer>
  </main>
  <dialog id="confirmation" aria-labelledby="confirmation-title" aria-describedby="confirmation-message">
    <form method="dialog">
      <h2 id="confirmation-title" class="text-h3 pa-4 pb-0 pl-6">确认操作</h2>
      <p id="confirmation-message"></p>
      <div class="actions"><button value="cancel" class="text" autofocus>取消</button><button value="continue" class="tonal">继续</button></div>
    </form>
  </dialog>
</body>
</html>
